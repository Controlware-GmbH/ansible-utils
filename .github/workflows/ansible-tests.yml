---
# This workflow will install Python dependencies and run ansible tests

name: Ansible Collection Code Testing

'on':
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pre_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install requirements
        run: |
          pip install --upgrade pre-commit
      - name: Run pre-commit
        run: |
          pre-commit run --all-files --color always

  ansible_tests:
    runs-on: ubuntu-22.04
    needs: [pre_commit]
    strategy:
      fail-fast: false
      matrix:
        ansible_core_version: ["2.18", "2.19", "2.20"]
        include:
          - ansible_core_version: "2.18"
            python_version: "3.12"
          - ansible_core_version: "2.19"
            python_version: "3.13"
          - ansible_core_version: "2.20"
            python_version: "3.14"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python_version }}
      - name: Upgrade pip
        run: |
          pip install --upgrade pip
      - name: Install requirements
        run: |
          pip install --upgrade ansible-core==${{ matrix.ansible_core_version }}
          pip install --upgrade -r .github/requirements-ansible-test_\
          ${{ matrix.ansible_core_version }}.txt
      - name: Ansible-Test Sanity
        run: |
          cd ansible_collections/controlware/utils/
          ansible-test sanity
          ansible-test units --venv
