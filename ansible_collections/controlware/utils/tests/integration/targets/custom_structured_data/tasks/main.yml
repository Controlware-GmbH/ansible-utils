---
- name: Create an isolated directory on the controller
  ansible.builtin.tempfile:
    state: directory
    prefix: custom-structured-data-test-
  delegate_to: localhost
  become: false
  check_mode: false
  register: csdt_tmp

- name: Test custom structured data
  block:
    - name: Test successful operations
      ansible.builtin.include_tasks: behavior.yml

    - name: Test validation and filesystem errors
      ansible.builtin.include_tasks: validation.yml

  always:
    - name: Remove the test directory from the controller
      ansible.builtin.file:
        path: "{{ csdt_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false
      check_mode: false
